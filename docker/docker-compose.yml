# ============================================================
# A1TV Version 2 — Docker Compose
# Services: PostgreSQL, Redis, API Server, Workers, Nginx
# ============================================================

version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: a1tv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: a1tv
      POSTGRES_USER: a1tv
      POSTGRES_PASSWORD: a1tv_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a1tv"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: a1tv-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ──────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a1tv-api
    restart: unless-stopped
    command: npm start
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - CORS_ORIGINS=http://localhost:8080,http://localhost:5500
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=a1tv
      - DB_USER=a1tv
      - DB_PASSWORD=a1tv_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../frontend:/app/frontend:ro

  # ── Background Workers ──────────────────────────────────
  workers:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a1tv-workers
    restart: unless-stopped
    command: npm run workers
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=a1tv
      - DB_USER=a1tv
      - DB_PASSWORD=a1tv_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx (serves frontend + proxies API) ──────────────
  nginx:
    image: nginx:alpine
    container_name: a1tv-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
