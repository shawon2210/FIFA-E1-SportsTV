# ============================================================
# A1TV v2 — Docker Compose (Production)
# Services: frontend (nginx), api, workers, postgres, redis
# ============================================================

version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: a1tv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-a1tv}
      POSTGRES_USER: ${DB_USER:-a1tv}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-a1tv_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-a1tv}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: a1tv-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ──────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a1tv-api
    restart: unless-stopped
    command: npm start
    ports:
      - "${API_PORT:-3000}:3000"
    env_file: .env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGINS=http://localhost:${NGINX_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../frontend:/app/frontend:ro
      - backup_data:/tmp/a1tv-backups

  # ── Background Workers ──────────────────────────────────
  workers:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a1tv-workers
    restart: unless-stopped
    command: npm run workers
    env_file: .env
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backup_data:/tmp/a1tv-backups

  # ── Nginx (serves frontend + proxies API/WebSocket) ────
  nginx:
    image: nginx:alpine
    container_name: a1tv-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ..:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  backup_data:
  prometheus_data:
  grafana_data:

