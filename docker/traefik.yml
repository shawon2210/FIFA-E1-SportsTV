# A1TV v2 - Traefik Production Configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
api:
  dashboard: true
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@a1tv.com
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web
http:
  middlewares:
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 60s
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        stsSeconds: 31536000
